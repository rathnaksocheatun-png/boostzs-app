<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOSTZS.COM - Premium TikTok Boosting Service</title>

    <!-- Google Font: Kantumruy Pro & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Poppins:wght@600;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', sans-serif;
        }

        body {
            background-color: #050505; /* ពណ៌ខ្មៅដិត */
            color: #ff7ebb; /* ពណ៌ផ្កាឈូក */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Glassmorphism Premium Card */
        .card {
            background: rgba(18, 18, 22, 0.95);
            padding: 35px 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(0, 255, 102, 0.2);
            box-shadow: 0 0 35px rgba(0, 255, 102, 0.08), 0 15px 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        /* ចំណងជើងមានចលនា (Live Neon Glow Animation) */
        h1.logo {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00ff66; /* ពណ៌បៃតងភ្លឺ */
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.8),
                         0 0 20px rgba(0, 255, 102, 0.5),
                         0 0 30px rgba(0, 255, 102, 0.3);
            animation: neonPulse 1.8s infinite alternate;
            margin-bottom: 5px;
        }

        @keyframes neonPulse {
            0% {
                text-shadow: 0 0 8px rgba(0, 255, 102, 0.7),
                             0 0 18px rgba(0, 255, 102, 0.4);
                transform: scale(1);
            }
            100% {
                text-shadow: 0 0 15px rgba(0, 255, 102, 1),
                             0 0 30px rgba(0, 255, 102, 0.8),
                             0 0 45px rgba(0, 255, 102, 0.5);
                transform: scale(1.02);
            }
        }

        .subtitle {
            text-align: center;
            color: #ff94c7; /* ពណ៌ផ្កាឈូកស្រាល */
            font-size: 13px;
            margin-bottom: 30px;
            font-weight: 400;
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ff7ebb; /* ពណ៌ផ្កាឈូក */
            font-size: 14px;
            font-weight: 600;
        }

        select, input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #331222;
            background: #0d0d11;
            color: #ffb3d9; /* ពណ៌ផ្កាឈូកភ្លឺ */
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            border-color: #00ff66;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.3);
        }

        /* Styling Options in Dropdown */
        option {
            background-color: #121216;
            color: #ff7ebb;
        }

        /* Premium Gradient Button */
        button {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #00ff66 0%, #00b347 100%);
            color: #050505; /* អក្សរខ្មៅដិតលើ Button ឱ្យធ្លាច្បាស់ */
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 20px rgba(0, 255, 102, 0.3);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 255, 102, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="card">
    <h1 class="logo">BOOSTZS</h1>
    <p class="subtitle">សេវាកម្មបង្កើន TikTok ឆាប់រហ័ស និងមានសុត្ថិភាព «««««
     Like   , View   , Comment  , Save   , Follow    គឺសុទ្ធតែខ្មែរទាំងអស់🇰🇭 »»»»»»»</p>
    <h5>បើអាខោនអ្នកលក់មាន Likes , Views , Comments ច្រើន នោះប្រាកដណាស់នឹងបង្កើនទំនុកចិត្តអ្នកទិញ 70% ភ្លាមៗ</h5>🔥

    <form id="orderForm">
        <div class="form-group">
            <label>ជ្រើសរើសសេវាកម្ម</label>
            <select id="service" required>
                <option value="1">TikTok Followers - $2 / 1000</option>
                <option value="2">TikTok Likes - $1 / 1000</option>
                <option value="3">TikTok Views - $0.50 / 1000</option>
            </select>
        </div>

        <div class="form-group">
            <label>Link វីដេអូ ឬ គណនី TikTok</label>
            <input type="url" id="link" placeholder="https://www.tiktok.com/@username/video/..." required>
        </div>

        <div class="form-group">
            <label>ចំនួន (Quantity)</label>
            <input type="number" id="quantity" min="100" value="1000" required>
        </div>

        <button type="submit">បញ្ជាទិញឥឡូវនេះ</button>
    </form>

    <div id="message"></div>
</div>

<script>
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const messageDiv = document.getElementById('message');
        messageDiv.style.color = '#00ff66';
        messageDiv.innerText = "កំពុងដំណើរការ...";

        const orderData = {
            service: document.getElementById('service').value,
            link: document.getElementById('link').value,
            quantity: document.getElementById('quantity').value
        };

        try {
            const response = await fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            });

            const result = await response.json();
            if(result.success) {
                messageDiv.style.color = '#00ff66';
                messageDiv.innerText = "ការបញ្ជាទិញបានជោគជ័យ! Order ID: " + result.order_id;
            } else {
                messageDiv.style.color = '#ff4d4d';
                messageDiv.innerText = "មានបញ្ហា: " + result.error;
            }
        } catch (err) {
            messageDiv.style.color = '#ff4d4d';
            messageDiv.innerText = "មិនអាចភ្ជាប់ទៅកាន់ Server បានទេ!";
        }
    });
</script>

</body>
</html>
